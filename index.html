<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H&A Store And Repair System</title>
    <style>
        :root {
            --primary-color: #0077b6;
            --secondary-color: #0096c7;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --danger-color: #e63946;
            --warning-color: #ffb703;
            --success-color: #2a9d8f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin: 0;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-danger { background-color: var(--danger-color); }
        .btn-warning { background-color: var(--warning-color); color: #000; }
        .btn-success { background-color: var(--success-color); }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }
        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>H&A Store And Repair</h1>
        <button class="btn" onclick="openMenu()">القائمة</button>
    </header>

    <div class="container">
        
        <!-- قسم بيع جديد مع اختيار العميل -->
        <div class="card">
            <h3>إتمام عملية بيع جديدة</h3>
            <label>اختر العميل:</label>
            <select id="saleClientSelect">
                <option value="">-- عميل نقدي / بدون تسجيل --</option>
            </select>
            <button class="btn btn-success" onclick="completeSale()" style="margin-top: 10px;">إتمام البيع</button>
        </div>

        <!-- إدارة العملاء -->
        <div class="card">
            <h3>إدارة العملاء</h3>
            <input type="text" id="clientName" placeholder="اسم العميل">
            <input type="text" id="clientPhone" placeholder="رقم الهاتف">
            <button class="btn" onclick="saveClient()">إضافة العميل</button>
        </div>
        <div id="clientsList"></div>

        <!-- إدارة الموردين -->
        <div class="card">
            <h3>إدارة الموردين</h3>
            <input type="text" id="supplierName" placeholder="اسم المورد">
            <input type="text" id="supplierPhone" placeholder="رقم الهاتف">
            <button class="btn" onclick="saveSupplier()">إضافة المورد</button>
        </div>
        <div id="suppliersList"></div>

        <!-- عرض المنتجات -->
        <div class="card">
            <h3>المنتجات</h3>
            <div id="productsList"></div>
        </div>
    </div>

    <!-- نافذة تعديل المنتج الشاملة -->
    <div id="editProductModal" class="modal">
        <div class="modal-content">
            <h3>تعديل بيانات المنتج</h3>
            <input type="hidden" id="editProdIndex">
            <label>اسم المنتج:</label>
            <input type="text" id="editProdName">
            <label>الفئة:</label>
            <input type="text" id="editProdCategory">
            <label>التكلفة:</label>
            <input type="number" id="editProdCost">
            <label>سعر البيع:</label>
            <input type="number" id="editProdPrice">
            <label>الكمية:</label>
            <input type="number" id="editProdQty">
            <button class="btn" onclick="updateProductData()" style="margin-top:10px;">حفظ التعديلات</button>
            <button class="btn btn-danger" onclick="closeModal('editProductModal')" style="margin-top:5px;">إلغاء</button>
        </div>
    </div>

    <!-- نافذة تعديل العميل -->
    <div id="editClientModal" class="modal">
        <div class="modal-content">
            <h3>تعديل بيانات العميل</h3>
            <input type="hidden" id="editClientIndex">
            <label>اسم العميل:</label>
            <input type="text" id="editClientNameInput">
            <label>رقم الهاتف:</label>
            <input type="text" id="editClientPhoneInput">
            <button class="btn" onclick="updateClientData()" style="margin-top:10px;">حفظ التعديلات</button>
            <button class="btn btn-danger" onclick="closeModal('editClientModal')" style="margin-top:5px;">إلغاء</button>
        </div>
    </div>

    <!-- نافذة تعديل المورد -->
    <div id="editSupplierModal" class="modal">
        <div class="modal-content">
            <h3>تعديل بيانات المورد</h3>
            <input type="hidden" id="editSupplierIndex">
            <label>اسم المورد:</label>
            <input type="text" id="editSupplierNameInput">
            <label>رقم الهاتف:</label>
            <input type="text" id="editSupplierPhoneInput">
            <button class="btn" onclick="updateSupplierData()" style="margin-top:10px;">حفظ التعديلات</button>
            <button class="btn btn-danger" onclick="closeModal('editSupplierModal')" style="margin-top:5px;">إلغاء</button>
        </div>
    </div>

    <script>
        // البيانات الأولية
        let products = [
            { name: "A10s", category: "شاشات", cost: 450, price: 650, qty: 5, barcode: "HA120787" }
        ];
        let clients = [
            { name: "Hassan", phone: "01035098919" }
        ];
        let suppliers = [];

        // --- دوال المنتجات ---
        function renderProducts() {
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div style="border-bottom: 1px solid #eee; padding: 10px 0;">
                        <strong>${p.name}</strong><br>
                        الفئة: ${p.category} | التكلفة: ${p.cost} ج.م | الكمية: ${p.qty}<br>
                        سعر البيع: ${p.price} ج.م | باركود: ${p.barcode}<br>
                        <button class="btn btn-warning" onclick="openEditProduct(${index})" style="margin-top:5px;">تعديل المنتج</button>
                    </div>
                `;
            });
        }

        function openEditProduct(index) {
            document.getElementById('editProdIndex').value = index;
            document.getElementById('editProdName').value = products[index].name;
            document.getElementById('editProdCategory').value = products[index].category;
            document.getElementById('editProdCost').value = products[index].cost;
            document.getElementById('editProdPrice').value = products[index].price;
            document.getElementById('editProdQty').value = products[index].qty;
            document.getElementById('editProductModal').style.display = 'flex';
        }

        function updateProductData() {
            const index = document.getElementById('editProdIndex').value;
            products[index].name = document.getElementById('editProdName').value;
            products[index].category = document.getElementById('editProdCategory').value;
            products[index].cost = Number(document.getElementById('editProdCost').value);
            products[index].price = Number(document.getElementById('editProdPrice').value);
            products[index].qty = Number(document.getElementById('editProdQty').value);
            closeModal('editProductModal');
            renderProducts();
        }

        // --- دوال العملاء ---
        function saveClient() {
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            if(name && phone) {
                clients.push({name, phone});
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                renderClients();
                populateSaleClients();
            } else {
                alert('يرجى إدخال الاسم ورقم الهاتف');
            }
        }

        function renderClients() {
            const list = document.getElementById('clientsList');
            list.innerHTML = '';
            clients.forEach((c, index) => {
                list.innerHTML += `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>${c.name} - ${c.phone}</span>
                        <div>
                            <button class="btn btn-warning" onclick="openEditClient(${index})">تعديل</button>
                        </div>
                    </div>
                `;
            });
        }

        function openEditClient(index) {
            document.getElementById('editClientIndex').value = index;
            document.getElementById('editClientNameInput').value = clients[index].name;
            document.getElementById('editClientPhoneInput').value = clients[index].phone;
            document.getElementById('editClientModal').style.display = 'flex';
        }

        function updateClientData() {
            const index = document.getElementById('editClientIndex').value;
            clients[index].name = document.getElementById('editClientNameInput').value;
            clients[index].phone = document.getElementById('editClientPhoneInput').value;
            closeModal('editClientModal');
            renderClients();
            populateSaleClients();
        }

        function populateSaleClients() {
            const select = document.getElementById('saleClientSelect');
            select.innerHTML = '<option value="">-- عميل نقدي / بدون تسجيل --</option>';
            clients.forEach((c, index) => {
                select.innerHTML += `<option value="${index}">${c.name} - ${c.phone}</option>`;
            });
        }

        // --- دوال الموردين ---
        function saveSupplier() {
            const name = document.getElementById('supplierName').value;
            const phone = document.getElementById('supplierPhone').value;
            if(name && phone) {
                suppliers.push({name, phone});
                document.getElementById('supplierName').value = '';
                document.getElementById('supplierPhone').value = '';
                renderSuppliers();
            } else {
                alert('يرجى إدخال بيانات المورد');
            }
        }

        function renderSuppliers() {
            const list = document.getElementById('suppliersList');
            list.innerHTML = '';
            suppliers.forEach((s, index) => {
                list.innerHTML += `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>${s.name} - ${s.phone}</span>
                        <div>
                            <button class="btn btn-warning" onclick="openEditSupplier(${index})">تعديل</button>
                        </div>
                    </div>
                `;
            });
        }

        function openEditSupplier(index) {
            document.getElementById('editSupplierIndex').value = index;
            document.getElementById('editSupplierNameInput').value = suppliers[index].name;
            document.getElementById('editSupplierPhoneInput').value = suppliers[index].phone;
            document.getElementById('editSupplierModal').style.display = 'flex';
        }

        function updateSupplierData() {
            const index = document.getElementById('editSupplierIndex'].value;
            suppliers[index].name = document.getElementById('editSupplierNameInput').value;
            suppliers[index].phone = document.getElementById('editSupplierPhoneInput').value;
            closeModal('editSupplierModal');
            renderSuppliers();
        }

        // --- دوال عامة ---
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function completeSale() {
            const selectedClientIndex = document.getElementById('saleClientSelect').value;
            let clientName = "عميل نقدي";
            if (selectedClientIndex !== "") {
                clientName = clients[selectedClientIndex].name;
            }
            alert("تم إتمام عملية البيع بنجاح لصالح: " + clientName);
        }

        function openMenu() {
            alert("القائمة الرئيسية");
        }

        // التهيئة عند التشغيل
        renderProducts();
        renderClients();
        renderSuppliers();
        populateSaleClients();
    </script>
</body>
</html>
